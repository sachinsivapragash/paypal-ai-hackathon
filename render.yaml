# One-click deploy on Render (free plan). Secrets are set in the Render dashboard, never in git.
services:
  - type: web
    name: duepilot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: MAX_INVOICE_AMOUNT
        value: 5000
      - key: MAX_PAYOUT_AMOUNT
        value: 500
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_INVOICER_EMAIL
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
